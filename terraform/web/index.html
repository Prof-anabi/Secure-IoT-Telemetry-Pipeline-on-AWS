<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ESP32 IoT Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --primary-color: #0d6efd;
      --bg-dark: #1e1e2f;
      --bg-card: #292c3e;
      --text-color: #f0f0f0;
      --accent-green: #25c685;
      --accent-blue: #1e90ff;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-color);
      font-family: 'Segoe UI', sans-serif;
      padding: 2rem;
    }

    .dashboard-title {
      font-size: 2.5rem;
      font-weight: 600;
      color: var(--primary-color);
      text-align: center;
      margin-bottom: 30px;
    }

    .card {
      background-color: var(--bg-card);
      border: none;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .sensor-title {
      font-size: 1.2rem;
      margin-bottom: 10px;
      color: #bbb;
    }

    .sensor-value {
      font-size: 3rem;
      color: var(--accent-green);
      font-weight: 600;
    }

    .timestamp {
      font-size: 0.9rem;
      color: #888;
      margin-top: 10px;
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.85rem;
      color: #777;
    }

    @media (max-width: 600px) {
      .sensor-value {
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="dashboard-title">📡 ESP32 Live IoT Dashboard</div>
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card text-center">
          <div class="sensor-title">Temperature</div>
          <div id="temp-value" class="sensor-value">-- °C</div>
          <div class="sensor-title mt-3">Humidity</div>
          <div id="humidity-value" class="sensor-value">-- %</div>
          <div class="timestamp" id="timestamp">Last updated: --</div>
        </div>
      </div>
    </div>

    <div class="row justify-content-center mt-5">
      <div class="col-md-8">
        <div class="card">
          <canvas id="sensorChart" height="100"></canvas>
        </div>
      </div>
    </div>

    <footer>Designed with ❤️ for real-time IoT monitoring using AWS + ESP32</footer>
  </div>

  <script>
    const labels = [];
    const tempData = [];
    const humidityData = [];

    const ctx = document.getElementById('sensorChart').getContext('2d');
    const sensorChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: 'Temperature (°C)',
            borderColor: 'rgba(30, 144, 255, 0.8)',
            backgroundColor: 'rgba(30, 144, 255, 0.1)',
            data: tempData,
            tension: 0.3
          },
          {
            label: 'Humidity (%)',
            borderColor: 'rgba(37, 198, 133, 0.8)',
            backgroundColor: 'rgba(37, 198, 133, 0.1)',
            data: humidityData,
            tension: 0.3
          }
        ]
      },
      options: {
        scales: {
          y: { beginAtZero: true }
        }
      }
    });

    async function fetchData() {
      try {
        const res = await fetch('latest-data.json'); // Same bucket, same level
        const data = await res.json();

        document.getElementById("temp-value").innerText = data.temperature + " °C";
        document.getElementById("humidity-value").innerText = data.humidity + " %";
        document.getElementById("timestamp").innerText =
          "Last updated: " + new Date(data.timestamp * 1000).toLocaleString();

        // Add to chart
        const timeLabel = new Date(data.timestamp * 1000).toLocaleTimeString();
        labels.push(timeLabel);
        tempData.push(data.temperature);
        humidityData.push(data.humidity);

        // Keep only last 10 readings
        if (labels.length > 10) {
          labels.shift();
          tempData.shift();
          humidityData.shift();
        }

        sensorChart.update();
      } catch (e) {
        console.error("Error loading data:", e);
      }
    }

    fetchData();
    setInterval(fetchData, 5000);
  </script>
</body>
</html>
